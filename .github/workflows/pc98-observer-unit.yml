name: PC-98 text observer unit tests

on:
  push:
    branches: [ np2debug-next-integration ]
  pull_request:
    branches: [ np2debug-next-integration ]

jobs:
  observer-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile observer and tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -I integration \
            integration/np2dn_pc98_text_observer.c \
            integration/tests/pc98_text_observer_unit/test_pc98_text_observer.c \
            -o pc98_text_observer_tests
      - name: Run tests
        run: ./pc98_text_observer_tests
      - name: Compile PC-98 script catalogue parser tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -I integration \
            integration/np2dn_pc98_script_catalog.c \
            integration/tests/pc98_script_catalog_unit/test_pc98_script_catalog.c \
            -o pc98_script_catalog_tests
      - name: Run PC-98 script catalogue parser tests
        run: ./pc98_script_catalog_tests
      - name: Compile DOS file tracker tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror \
            -I integration \
            integration/np2dn_dos_file_tracker.c \
            integration/tests/dos_file_tracker_unit/test_dos_file_tracker.c \
            -o dos_file_tracker_tests
      - name: Run DOS file tracker tests
        run: ./dos_file_tracker_tests
