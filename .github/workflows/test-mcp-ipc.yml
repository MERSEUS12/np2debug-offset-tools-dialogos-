name: MCP IPC protocol tests

on:
  push:
    branches: [ np2debug-next-integration ]
  pull_request:
    branches: [ np2debug-next-integration ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias MCP
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r mcp_server/requirements.txt
      - name: Comprobar sintaxis Python
        run: python -m py_compile mcp_server/server.py mcp_server/tests/test_ipc_protocol.py
      - name: Probar tamaños y serialización IPC v2
        shell: pwsh
        run: |
          $env:PYTHONPATH = "mcp_server"
          python -m unittest discover -s mcp_server/tests -v

      - name: Preparar compilador MSVC para pruebas nativas
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Probar máquina de estados de la cola C real
        shell: pwsh
        run: |
          cl /nologo /W4 /I mcp_server/tests/queue_unit/stubs /I integration mcp_server/tests/queue_unit/test_command_queue.c integration/np2dn_command_queue.c integration/np2dn_dos_file_tracker.c user32.lib /Fe:mcp_server/tests/queue_unit/queue_unit_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & mcp_server/tests/queue_unit/queue_unit_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probar Named Pipe Win32 real
        shell: pwsh
        run: |
          cl /nologo /W4 /DNP2DN_IPC_COMMAND_TIMEOUT_MS=300 /I mcp_server/tests/ipc_win32/stubs /I integration mcp_server/tests/ipc_win32/test_ipc_server.c integration/np2dn_ipc_win32.c /Fe:mcp_server/tests/ipc_win32/ipc_win32_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & mcp_server/tests/ipc_win32/ipc_win32_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probar núcleo universal de salto de diálogos
        shell: pwsh
        run: |
          cl /nologo /W4 /I integration integration/tests/dialogue_core_unit/test_dialogue_core.c integration/np2dn_dialogue_core.c /Fe:integration/tests/dialogue_core_unit/dialogue_core_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & integration/tests/dialogue_core_unit/dialogue_core_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probar observador de texto PC-98
        shell: pwsh
        run: |
          cl /nologo /W4 /I integration integration/tests/pc98_text_observer_unit/test_pc98_text_observer.c integration/np2dn_pc98_text_observer.c /Fe:integration/tests/pc98_text_observer_unit/pc98_text_observer_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & integration/tests/pc98_text_observer_unit/pc98_text_observer_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probar parser de catálogo de diálogos PC-98
        shell: pwsh
        run: |
          cl /nologo /W4 /I integration integration/tests/pc98_script_catalog_unit/test_pc98_script_catalog.c integration/np2dn_pc98_script_catalog.c /Fe:integration/tests/pc98_script_catalog_unit/pc98_script_catalog_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & integration/tests/pc98_script_catalog_unit/pc98_script_catalog_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probar tracker de archivos DOS
        shell: pwsh
        run: |
          cl /nologo /W4 /I integration integration/tests/dos_file_tracker_unit/test_dos_file_tracker.c integration/np2dn_dos_file_tracker.c /Fe:integration/tests/dos_file_tracker_unit/dos_file_tracker_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & integration/tests/dos_file_tracker_unit/dos_file_tracker_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
