name: Compilar np21debug x64

on:
  workflow_dispatch:        # boton "Run workflow" en la pestana Actions
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar YASM para Visual Studio (vsyasm)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/yasm/yasm/releases/download/v1.3.0/vsyasm-1.3.0-win64.zip' -OutFile vsyasm.zip
          Expand-Archive vsyasm.zip -DestinationPath vsyasm
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $bc = Join-Path $vs 'MSBuild\Microsoft\VC\v170\BuildCustomizations'
          Copy-Item vsyasm\vsyasm.props, vsyasm\vsyasm.targets, vsyasm\vsyasm.xml $bc
          $yasm = (Resolve-Path vsyasm).Path + '\'
          "YASMPATH=$yasm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem $bc -Filter 'vsyasm*'

      - name: Preparar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar (Release NT, x64)
        shell: cmd
        run: >
          msbuild win9x\np21.sln /m
          "/p:Configuration=Release NT"
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /v:minimal
          /fl "/flp:logfile=msbuild.log;verbosity=normal"

      - name: Copiar las DLL de Visual C++ junto al .exe
        if: success()
        continue-on-error: true
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dll = Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC') -Recurse -Filter msvcp140.dll |
                 Where-Object { $_.FullName -match 'x64\\Microsoft\.VC143\.CRT' } | Select-Object -First 1
          if ($dll) { Copy-Item (Join-Path $dll.DirectoryName '*.dll') bin\ }
          Get-ChildItem bin

      - name: Guardar el programa compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: np21debug-x64
          path: bin/

      - name: Guardar el registro de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-compilacion
          path: msbuild.log
          if-no-files-found: ignore
